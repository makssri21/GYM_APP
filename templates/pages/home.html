{% extends "base.html" %}

{% block content %}
<div class="container mt-4">

  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">Zahtjev za članstvo u teretani</h4>
    </div>

    <div class="card-body">

      <form id="requestForm" method="POST" action="{{ url_for('user.submit_request') }}">

        <div class="mb-3">
          <label for="RequestTitle" class="form-label">
            Naslov zahtjeva
          </label>
          <input type="text" class="form-control" id="RequestTitle" name="RequestTitle" maxlength="128" required>
        </div>

        <div class="mb-3">
          <label for="DateOfBirth" class="form-label">
            Datum rođenja
          </label>
          <input type="date" class="form-control" id="DateOfBirth" name="DateOfBirth" required>
        </div>

        <div class="mb-3">
          <label for="Place" class="form-label">
            Mjesto
          </label>
          <input type="text" class="form-control" id="Place" name="Place" maxlength="64" required>
        </div>

        <div class="mb-3">
          <label for="Comment" class="form-label">
            Komentar
          </label>
          <textarea class="form-control" id="Comment" name="Comment" rows="5" maxlength="1024" required
            placeholder="Unesite dodatne informacije..."></textarea>
        </div>

        <div class="text-end">
          <button type="submit" class="btn btn-success">
            Pošalji zahtjev
          </button>
        </div>

      </form>

    </div>
  </div>

</div>

<script>
  document.getElementById("requestForm").addEventListener("submit", function () {

    // Resetuje polja nakon slanja forme
    setTimeout(() => {
      this.reset();
    }, 100);

  });
</script>

{% endblock %}
